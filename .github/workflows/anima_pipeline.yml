name: Anima T2I Pipeline

on:
  repository_dispatch:
    types: [trigger_anima_generation]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt"
        required: true
        default: "1girl, anime, vibrant, masterpiece"
      chat_id:
        description: "Telegram chat_id (optional)"
        required: false
        default: ""

concurrency:
  group: anima-t2i
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      HF_TOKEN:           ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Show runner resources
        run: |
          echo "=== CPU / RAM ==="
          nproc
          free -h
          df -h /

      - name: Cache HuggingFace hub
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-anima-cache-${{ runner.os }}-v1
          restore-keys: |
            hf-anima-cache-${{ runner.os }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.4.1 torchvision==0.19.1
          pip install -r requirements.txt
          python -c "import torch, diffusers, transformers; print('torch', torch.__version__); print('diffusers', diffusers.__version__); print('transformers', transformers.__version__)"

      - name: Resolve payload
        id: payload
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "prompt=${{ toJson(github.event.client_payload.prompt) }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ toJson(github.event.client_payload.chat_id) }}" >> $GITHUB_OUTPUT
          else
            echo "prompt=${{ toJson(github.event.inputs.prompt) }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ toJson(github.event.inputs.chat_id) }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Anima generation
        env:
          PROMPT:  ${{ steps.payload.outputs.prompt }}
          CHAT_ID: ${{ steps.payload.outputs.chat_id }}
        run: |
          PROMPT_CLEAN=$(echo "$PROMPT" | sed 's/^"//; s/"$//')
          CHAT_CLEAN=$(echo "$CHAT_ID" | sed 's/^"//; s/"$//')

          echo "=== PROMPT ==="
          echo "$PROMPT_CLEAN"
          echo "=== CHAT_ID ==="
          echo "$CHAT_CLEAN"

          python run_anima.py \
            --prompt "$PROMPT_CLEAN" \
            --output "output.png" \
            --chat-id "$CHAT_CLEAN" \
            --width 1024 \
            --height 1024 \
            --steps 30 \
            --cfg 4.5 \
            --seed -1

          if [ ! -f output.png ]; then
            echo "::error::output.png was not produced"
            exit 1
          fi
          ls -lh output.png

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anima-output
          path: output.png
          if-no-files-found: warn
          retention-days: 7

      - name: Fallback: re-send via curl
        if: success()
        env:
          CHAT_ID: ${{ steps.payload.outputs.chat_id }}
          PROMPT:  ${{ steps.payload.outputs.prompt }}
        run: |
          CHAT_CLEAN=$(echo "$CHAT_ID" | sed 's/^"//; s/"$//')
          PROMPT_CLEAN=$(echo "$PROMPT" | sed 's/^"//; s/"$//')
          if [ -f output.png ] && [ -n "$CHAT_CLEAN" ]; then
            echo "Sending photo via curl as fallback..."
            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_CLEAN}" \
              -F "photo=@output.png" \
              -F "caption=✅ ${PROMPT_CLEAN:0:100}"
          else
            echo "Skipping curl fallback (no chat_id or no image)"
          fi
